  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
    const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
    const _html = document.documentElement;
    if (!_html.classList.contains('dark')) { themeToggleDarkIcon.classList.remove('hidden'); }
    else { themeToggleLightIcon.classList.remove('hidden'); }
    themeToggle.addEventListener('click', () => {
      if (window.INEMA && INEMA.setPref) { INEMA.setPref('theme', _html.classList.contains('dark') ? 'claro' : 'inema-dark'); }
      else { _html.classList.toggle('dark'); }
      themeToggleDarkIcon.classList.toggle('hidden', _html.classList.contains('dark'));
      themeToggleLightIcon.classList.toggle('hidden', !_html.classList.contains('dark'));
      try { localStorage.setItem('theme', _html.classList.contains('dark') ? 'dark' : 'light'); } catch (e) {}
    });
    function toggleTopic(button) {
      const item = button.closest('.topic-item');
      const exp = item.querySelector('.topic-explanation');
      const card = button.closest('[id^="modulo-"]') || document;
      card.querySelectorAll('.topic-explanation.active').forEach(e => { if (e !== exp) { e.classList.remove('active'); const b = e.parentElement.querySelector('[aria-controls]'); if (b) b.setAttribute('aria-expanded', 'false'); } });
      exp.classList.toggle('active');
      button.setAttribute('aria-expanded', exp.classList.contains('active') ? 'true' : 'false');
    }
    let _lastModalTrigger = null;
    function openModal(id){ const m=document.getElementById(id); if(m){ _lastModalTrigger=document.activeElement; m.classList.remove('hidden'); document.body.style.overflow='hidden'; const c=m.querySelector('button'); if(c) c.focus(); } }
    function closeModal(){ document.querySelectorAll('.modal').forEach(m=>m.classList.add('hidden')); document.body.style.overflow='auto'; if(_lastModalTrigger){ _lastModalTrigger.focus(); _lastModalTrigger=null; } }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>
